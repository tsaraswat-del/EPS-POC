<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Registration</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #0066cc; color: white; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h2>User Info Form</h2>
  <form id="userForm">
    <div class="field"><label>First Name</label><input type="text" id="firstName" required></div>
    <div class="field"><label>Last Name</label><input type="text" id="lastName" required></div>
    <div class="field"><label>Email</label><input type="email" id="email" required></div>
    <div class="field"><label>Phone</label><input type="tel" id="phone" required></div>
    <div class="field"><label>Age</label><input type="number" id="age" required></div>
    <button type="submit">Submit</button>
  </form>
  <p id="msg"></p>

  <script>
    document.getElementById('userForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        age: document.getElementById('age').value
      };
      
      const res = await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      document.getElementById('msg').innerText = data.message;
      if (res.ok) e.target.reset();
    });
  </script>
</body>
</html>
